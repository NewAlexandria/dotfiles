[project]
name = "x-archive"
version = "0.1.0"
description = "X/Twitter account archiver for research"
authors = [
    {name = "zak"}
]
requires-python = "^3.11"
dependencies = [
    "twscrape (>=0.18.1,<0.19.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "tomli (>=2.4.1,<3.0.0)",
    "browser-cookie3 (>=0.20.1,<0.21.0)",
]

[project.scripts]
xarchive = "xarchive.cli:main"

[tool.poetry]
packages = [{ include = "xarchive" }]

[tool.poetry.group.dev.dependencies]
playwright = "^1.49.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
